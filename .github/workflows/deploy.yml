name: Deploy portfolio to S3 and CloudFront

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::561067234915:role/github-actions-portfolio-deploy
          aws-region: ap-south-1

      - name: Sync site files to S3
        run: aws s3 sync ./site s3://murali-aws-portfolio-2026-561067234915-ap-south-1-an --delete

      - name: Invalidate CloudFront cache
        run: aws cloudfront create-invalidation --distribution-id E3P8VXHTYD7XSG --paths "/*"